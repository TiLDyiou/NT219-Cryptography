<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIT Store — Topology bảo mật</title>
<style>
    html,body{height:100%;margin:0}
    body{background:#fff;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    svg{display:block;width:100vw;height:100vh;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    .n-name{font-weight:700;font-size:16px;fill:#16314a}
    .n-role{font-size:12.5px;fill:#5d6f82}
    .e-label{font-size:13px;font-weight:700}
    .z-machine{font-size:15px;font-weight:700}
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet"></svg>
<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a,c){const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!=='')e.setAttribute(k,a[k]);
    if(c)[].concat(c).forEach(x=>e.appendChild(x));return e;}
function add(e){svg.appendChild(e);return e;}
function txt(s){return document.createTextNode(s);}
function poly(pts,fill,stroke){return el('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill,stroke:stroke||'#0e3e63','stroke-width':1.1,'stroke-linejoin':'round'});}

const BL={lite:'#46a6df',mid:'#1f7ec2',dark:'#155a8a',ln:'#0e3e63'};

/* security channel colors */
const SEC={
  tls  :'#0a7d82',  // TLS/HTTPS
  oidc :'#1f6fb2',  // OAuth2/OIDC/JWT
  hmac :'#8a2d8f',  // HMAC + Internal-Token (S2S)
  vault:'#b45309',  // Vault Transit (envelope + sign)
  wg   :'#9b2226',  // WireGuard (Tailscale)
};
const defs=el('defs');
Object.entries(SEC).forEach(([k,c])=>defs.appendChild(
  el('marker',{id:'m-'+k,viewBox:'0 -6 12 12',refX:9,refY:0,markerWidth:8,markerHeight:8,orient:'auto'},
     el('path',{d:'M0,-6 L12,0 L0,6 Z',fill:c}))));
const f=el('filter',{id:'sh',x:'-30%',y:'-30%',width:'160%',height:'160%'});
f.appendChild(el('feDropShadow',{dx:1.5,dy:2.5,stdDeviation:1.6,'flood-color':'#16314a','flood-opacity':0.22}));
defs.appendChild(f);
svg.appendChild(defs);

/* =================== ZONES =================== */
const zones=[
 {label:'MÁY HOST A  —  3 VM (libvirt 192.168.122.x)',x:296,y:250,w:892,h:516,col:'#1f6fb2'},
 {label:'MÁY HOST B  —  Tailscale',x:1408,y:146,w:168,h:380,col:'#9b2226'},
];
zones.forEach(z=>{
    add(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:16,
        fill:z.col==='#9b2226'?'rgba(155,34,38,.03)':'rgba(31,111,178,.025)',
        stroke:z.col,'stroke-width':2.4,'stroke-dasharray':'10 7'}));
    add(el('rect',{x:z.x+14,y:z.y-14,width:z.label.length*8.0+18,height:28,rx:7,fill:'#fff',stroke:z.col,'stroke-width':1.3}));
    add(el('text',{x:z.x+24,y:z.y+5,class:'z-machine',fill:z.col},txt(z.label)));
});
add(el('line',{x1:1392,y1:175,x2:1392,y2:520,stroke:'#9b2226','stroke-width':1.5,'stroke-dasharray':'9 6'}));

/* =================== CISCO-STYLE ICONS =================== */
function icon(type){const g=el('g',{filter:'url(#sh)'}),A=e=>g.appendChild(e);
  switch(type){
    case 'laptop':
      A(poly([[-23,-17],[23,-17],[19,10],[-19,10]],'#e8f3fb'));
      A(poly([[-19,-13],[19,-13],[16,6],[-16,6]],BL.mid));
      A(poly([[-29,10],[29,10],[25,19],[-25,19]],BL.lite));
      A(el('rect',{x:-6,y:11,width:12,height:3,rx:1.5,fill:BL.dark}));break;
    case 'switch':{
      const FTL=[-29,-4],FTR=[19,-4],FBL=[-29,12],FBR=[19,12],BTL=[-17,-17],BTR=[31,-17],BBR=[31,-1];
      A(poly([FTL,FTR,FBR,FBL],BL.mid));A(poly([FTR,BTR,BBR,FBR],BL.dark));A(poly([FTL,FTR,BTR,BTL],BL.lite));
      const cx=3,cy=-10;[[-14,0,14,0],[-8,7,8,-7]].forEach(([x1,y1,x2,y2])=>{
        A(el('line',{x1:cx+x1,y1:cy+y1,x2:cx+x2,y2:cy+y2,stroke:'#fff','stroke-width':1.9,'stroke-linecap':'round'}));
        A(el('path',{d:`M${cx+x1},${cy+y1} l4,-2 m-4,2 l4,2`,stroke:'#fff','stroke-width':1.6,fill:'none','stroke-linecap':'round'}));
        A(el('path',{d:`M${cx+x2},${cy+y2} l-4,-2 m4,2 l-4,2`,stroke:'#fff','stroke-width':1.6,fill:'none','stroke-linecap':'round'}));});break;}
    case 'server':{
      const FTL=[-17,-23],FTR=[17,-23],FBL=[-17,23],FBR=[17,23],BTL=[-9,-31],BTR=[25,-31],BBR=[25,15];
      A(poly([FTL,FTR,FBR,FBL],BL.mid));A(poly([FTR,BTR,BBR,FBR],BL.dark));A(poly([FTL,FTR,BTR,BTL],BL.lite));
      for(let i=0;i<3;i++)A(el('line',{x1:-12,y1:-13+i*12,x2:12,y2:-13+i*12,stroke:'#dff0fb','stroke-width':2.2,'stroke-linecap':'round'}));
      A(el('circle',{cx:-8,cy:-18,r:2,fill:'#bfe3f7'}));A(el('circle',{cx:0,cy:-18,r:2,fill:'#bfe3f7'}));break;}
    case 'db':
      A(el('path',{d:'M-18,-17 a18,6.5 0 0 1 36,0 V17 a18,6.5 0 0 1 -36,0 Z',fill:BL.mid,stroke:BL.ln,'stroke-width':1.1}));
      A(el('path',{d:'M-18,-17 a18,6.5 0 0 0 36,0',fill:BL.lite,stroke:BL.ln,'stroke-width':1.1}));
      A(el('path',{d:'M-18,-3 a18,6.5 0 0 0 36,0 M-18,9 a18,6.5 0 0 0 36,0',fill:'none',stroke:'#bfe3f7','stroke-width':1.5}));break;
    case 'cloud':
      A(el('path',{d:'M-26,12 a14,14 0 0 1 2,-28 a17,17 0 0 1 32,4 a13,13 0 0 1 3,24 Z',
        fill:'#eaf4fb',stroke:BL.mid,'stroke-width':2.4,'stroke-linejoin':'round'}));break;
  }return g;}

/* =================== NODES (chức năng đúng theo code) =================== */
const nodes=[
 {id:'client',  x:140,y:410,icon:'laptop',name:'Client',     role:'Browser + Keycloak login'},
 {id:'nginx',   x:360,y:410,icon:'server',name:'Nginx',      role:'Reverse proxy / TLS'},
 {id:'envoy',   x:560,y:410,icon:'switch',name:'Envoy',      role:'API gateway — routing'},
 {id:'keycloak',x:560,y:690,icon:'server',name:'Keycloak',   role:'OIDC — phát hành JWT (RS256)'},
 {id:'order',   x:830,y:330,icon:'server',name:'Order',      role:'Saga — verify JWT, ký HMAC'},
 {id:'inventory',x:830,y:560,icon:'server',name:'Inventory', role:'verify JWT, HMAC nội bộ'},
 {id:'payment', x:1100,y:330,icon:'server',name:'Payment',   role:'Envelope-encrypt — Stripe'},
 {id:'vault',   x:1100,y:560,icon:'server',name:'Vault',     role:'Transit: bọc DEK + ký sự kiện'},
 {id:'cloud',   x:1300,y:330,icon:'cloud', name:'Tailscale', role:'WireGuard tunnel'},
 {id:'postgres',x:1492,y:222,icon:'db',    name:'PostgreSQL',name2:'',role:'asyncpg / TLS'},
 {id:'kafka',   x:1492,y:452,icon:'server',name:'Kafka',     role:'audit events (đã ký)'},
 {id:'stripe',  x:1100,y:130,icon:'cloud', name:'Stripe',    role:'PSP — webhook HMAC'},
];
const M={};nodes.forEach(n=>M[n.id]=n);

/* =================== EDGES (nhãn = cơ chế bảo mật theo code) =================== */
const edges=[
 {s:'client',t:'nginx',   k:'tls', l:'HTTPS / TLS 1.3'},
 {s:'nginx', t:'envoy',   k:'tls', l:'reverse proxy'},
 {s:'client',t:'keycloak',k:'oidc',l:'OIDC login → JWT'},
 {s:'envoy', t:'order',   k:'oidc',l:'Bearer JWT (RS256)'},
 {s:'order', t:'keycloak',k:'oidc',l:'verify JWT (public key)'},
 {s:'order', t:'inventory',k:'hmac',l:'HMAC + Internal-Token'},
 {s:'order', t:'payment', k:'hmac',l:'HMAC + Internal-Token'},
 {s:'payment',t:'vault',  k:'vault',l:'Vault Transit (envelope + ký)'},
 {s:'payment',t:'stripe', k:'tls', l:'Stripe API + webhook HMAC'},
 {s:'payment',t:'cloud',  k:'wg',  l:''},
 {s:'cloud', t:'postgres',k:'wg',  l:'WireGuard + TLS'},
 {s:'cloud', t:'kafka',   k:'wg',  l:'WireGuard'},
];
function trimPts(s,e,r1,r2){const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy)||1;
  return [{x:s.x+dx/d*r1,y:s.y+dy/d*r1},{x:e.x-dx/d*r2,y:e.y-dy/d*r2}];}

const labelJobs=[];
edges.forEach(ed=>{
  const c=SEC[ed.k],s=M[ed.s],e=M[ed.t];
  const [a,b]=trimPts(s,e,36,33);
  add(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:c,'stroke-width':2.8,'marker-end':`url(#m-${ed.k})`}));
  if(!ed.l)return;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dy)>Math.abs(dx)*1.4){           // gần dọc → đặt nhãn sang PHẢI, không phủ đường
    labelJobs.push({x:mx+16,y:my,anchor:'start',l:ed.l,c});
  }else{                                        // ngang/chéo → đặt PHÍA TRÊN đường
    const d=Math.hypot(dx,dy)||1;let nx=-dy/d,ny=dx/d;if(ny>0){nx=-nx;ny=-ny;}
    labelJobs.push({x:mx+nx*19,y:my+ny*19,anchor:'middle',l:ed.l,c});
  }
});
labelJobs.forEach(j=>{const w=j.l.length*7.4+14, bx=j.anchor==='start'?j.x-6:j.x-w/2;
  add(el('rect',{x:bx,y:j.y-12,width:w,height:23,rx:5,fill:'#fff',stroke:j.c,'stroke-width':1}));
  add(el('text',{x:j.anchor==='start'?j.x:j.x,y:j.y+4,'text-anchor':j.anchor,class:'e-label',fill:j.c},txt(j.l)));
});

/* =================== NODE ICONS + LABELS on top =================== */
nodes.forEach(n=>{
  const g=el('g',{transform:`translate(${n.x},${n.y})`});
  g.appendChild(icon(n.icon));
  g.appendChild(el('text',{x:0,y:44,'text-anchor':'middle',class:'n-name'},txt(n.name)));
  g.appendChild(el('text',{x:0,y:61,'text-anchor':'middle',class:'n-role'},txt(n.role)));
  add(g);
});
</script>
</body>
</html>
