<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIT Store — Kênh giao tiếp & Cơ chế bảo mật</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    :root{
        --bg:#eef2f6; --ink:#22384f; --muted:#64788f;
        --tls:#0a7d82; --oidc:#1f6fb2; --mtls:#8a2d8f; --vault:#b45309; --wg:#9b2226;
        --mono:'JetBrains Mono',monospace; --sans:'Inter',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
    header{padding:16px 28px;border-bottom:1px solid #d3dce4;background:#fff;
        display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
    h1{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.3px;text-transform:uppercase}
    header p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
    .legend{display:flex;gap:15px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;align-items:center}
    .lg{display:flex;align-items:center;gap:7px}
    .ll{width:28px;border-top-width:3px;border-top-style:solid}
    .ll.tls{border-color:var(--tls)} .ll.oidc{border-color:var(--oidc)}
    .ll.mtls{border-color:var(--mtls)} .ll.vault{border-color:var(--vault)}
    .ll.wg{border-color:var(--wg)}
    #wrap{padding:18px;overflow:auto}
    svg{display:block;background:#fff;border:1px solid #d3dce4;border-radius:8px}
    .n-name{font-family:var(--sans);font-weight:600;font-size:13px;fill:var(--ink)}
    .n-role{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
    .e-label{font-family:var(--mono);font-size:9.5px;font-weight:600}
    .z-machine{font-family:var(--mono);font-size:12px;font-weight:700}
</style>
</head>
<body>
<header>
    <div>
        <h1>UIT Store — Kênh giao tiếp & Cơ chế bảo mật</h1>
        <p>NT219 Cryptography · Mỗi đường nối ghi rõ hình thức bảo mật dùng để giao tiếp</p>
    </div>
    <div class="legend">
        <div class="lg"><span class="ll tls"></span>TLS / HTTPS</div>
        <div class="lg"><span class="ll oidc"></span>OAuth2 · OIDC · JWT</div>
        <div class="lg"><span class="ll mtls"></span>mTLS (service mesh)</div>
        <div class="lg"><span class="ll vault"></span>Vault Transit · AppRole</div>
        <div class="lg"><span class="ll wg"></span>WireGuard (Tailscale)</div>
    </div>
</header>
<div id="wrap"><svg id="svg" width="1470" height="760" viewBox="0 0 1470 760"></svg></div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a,c){const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!=='')e.setAttribute(k,a[k]);
    if(c)[].concat(c).forEach(x=>e.appendChild(x));return e;}
function add(e){svg.appendChild(e);return e;}
function txt(s){return document.createTextNode(s);}

const defs=el('defs');
[['m-tls','#0a7d82'],['m-oidc','#1f6fb2'],['m-mtls','#8a2d8f'],['m-vault','#b45309'],['m-wg','#9b2226']].forEach(([id,c])=>
    defs.appendChild(el('marker',{id,viewBox:'0 -5 10 10',refX:8,refY:0,markerWidth:7,markerHeight:7,orient:'auto'},
        el('path',{d:'M0,-5L10,0L0,5',fill:c}))));
svg.appendChild(defs);

/* =================== ZONES =================== */
const zones=[
 {label:'MÁY HOST A · 3 VM (libvirt 192.168.122.x)',x:268,y:244,w:812,h:452,col:'#1f6fb2'},
 {label:'MÁY HOST B · Tailscale',x:1288,y:128,w:158,h:346,col:'#9b2226'},
];
zones.forEach(z=>{
    add(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:12,
        fill:z.col==='#9b2226'?'rgba(155,34,38,.03)':'rgba(31,111,178,.025)',
        stroke:z.col,'stroke-width':2,'stroke-dasharray':'8 5'}));
    add(el('rect',{x:z.x+10,y:z.y-11,width:z.label.length*7.2+14,height:22,rx:5,fill:'#fff',stroke:z.col,'stroke-width':1}));
    add(el('text',{x:z.x+18,y:z.y+4,class:'z-machine',fill:z.col},txt(z.label)));
});
add(el('line',{x1:1180,y1:150,x2:1180,y2:470,stroke:'#9b2226','stroke-width':1.3,'stroke-dasharray':'7 6'}));

/* =================== ICONS =================== */
function cog(rO,rI,n){let p=[],N=n*2;for(let i=0;i<N;i++){const a=Math.PI*2*i/N-Math.PI/2,r=i%2?rI:rO;p.push([(r*Math.cos(a)).toFixed(1),(r*Math.sin(a)).toFixed(1)]);}return'M'+p.map(q=>q.join(',')).join(' L')+' Z';}
function icon(type,c){const g=el('g',{}),S=(t,a)=>g.appendChild(el(t,a));
  switch(type){
    case 'client':
      S('rect',{x:-21,y:-16,width:42,height:29,rx:3,fill:'#fff',stroke:c,'stroke-width':2});
      S('rect',{x:-17,y:-12,width:34,height:21,rx:1,fill:c,opacity:.12});
      S('rect',{x:-6,y:13,width:12,height:5,fill:c});S('rect',{x:-13,y:18,width:26,height:3.5,rx:1.5,fill:c});break;
    case 'server':
      S('rect',{x:-18,y:-18,width:36,height:36,rx:4,fill:'#fff',stroke:c,'stroke-width':2});
      for(let i=0;i<3;i++){S('rect',{x:-12,y:-12+i*9,width:24,height:5.5,rx:1.5,fill:'none',stroke:c,'stroke-width':1.4});S('circle',{cx:-8,cy:-9.5+i*9,r:1.5,fill:c});}break;
    case 'gateway':
      S('path',{d:'M0,-21 L18,-10.5 L18,10.5 L0,21 L-18,10.5 L-18,-10.5 Z',fill:'#fff',stroke:c,'stroke-width':2});
      S('path',{d:'M-7,-6 L7,-6 M-7,0 L7,0 M-7,6 L7,6',stroke:c,'stroke-width':2,'stroke-linecap':'round'});break;
    case 'shield':
      S('path',{d:'M0,-20 L17,-12 V3 C17,14 9.5,19 0,22 C-9.5,19 -17,14 -17,3 V-12 Z',fill:'#fff',stroke:c,'stroke-width':2});
      S('circle',{cx:0,cy:-2,r:4.5,fill:'none',stroke:c,'stroke-width':2});S('rect',{x:-1.8,y:0,width:3.6,height:8,fill:c});break;
    case 'kms':
      S('rect',{x:-19,y:-18,width:38,height:36,rx:4,fill:'#fff',stroke:c,'stroke-width':2});
      S('circle',{cx:0,cy:0,r:9,fill:'none',stroke:c,'stroke-width':2});S('circle',{cx:0,cy:0,r:2.6,fill:c});
      for(let a=0;a<360;a+=45){const r1=9,r2=13,R=Math.PI/180;S('line',{x1:r1*Math.cos(a*R),y1:r1*Math.sin(a*R),x2:r2*Math.cos(a*R),y2:r2*Math.sin(a*R),stroke:c,'stroke-width':2,'stroke-linecap':'round'});}break;
    case 'service':
      S('path',{d:cog(14,10.5,8),fill:'#fff',stroke:c,'stroke-width':2,'stroke-linejoin':'round'});
      S('circle',{cx:0,cy:0,r:4.5,fill:'none',stroke:c,'stroke-width':2});break;
    case 'db':
      S('path',{d:'M-15,-14 a15,5.5 0 0 1 30,0 V14 a15,5.5 0 0 1 -30,0 Z',fill:'#fff',stroke:c,'stroke-width':2});
      S('path',{d:'M-15,-14 a15,5.5 0 0 0 30,0',fill:'none',stroke:c,'stroke-width':2});
      S('path',{d:'M-15,-2 a15,5.5 0 0 0 30,0 M-15,7 a15,5.5 0 0 0 30,0',fill:'none',stroke:c,'stroke-width':1.3,opacity:.55});break;
    case 'broker':
      S('circle',{cx:0,cy:-12,r:5.5,fill:'#fff',stroke:c,'stroke-width':2});
      S('circle',{cx:-11,cy:8,r:5.5,fill:'#fff',stroke:c,'stroke-width':2});
      S('circle',{cx:11,cy:8,r:5.5,fill:'#fff',stroke:c,'stroke-width':2});
      S('line',{x1:0,y1:-12,x2:-11,y2:8,stroke:c,'stroke-width':2});S('line',{x1:0,y1:-12,x2:11,y2:8,stroke:c,'stroke-width':2});S('line',{x1:-11,y1:8,x2:11,y2:8,stroke:c,'stroke-width':2});break;
    case 'cloud':
      S('path',{d:'M-20,9 a11,11 0 0 1 1.5,-22 a14,14 0 0 1 25,3 a10,10 0 0 1 2.5,19 Z',fill:'#fff',stroke:c,'stroke-width':2,'stroke-linejoin':'round'});break;
  }return g;}

/* =================== NODES =================== */
const nodes=[
 {id:'client',  x:120,y:380,icon:'client', c:'#64788f',name:'Client',     role:'Browser'},
 {id:'nginx',   x:360,y:400,icon:'server',  c:'#1f6fb2',name:'Nginx',      role:'TLS termination'},
 {id:'envoy',   x:520,y:400,icon:'gateway', c:'#1f6fb2',name:'Envoy',      role:'Verify JWT · mTLS'},
 {id:'keycloak',x:440,y:610,icon:'shield',  c:'#1f6fb2',name:'Keycloak',   role:'OIDC · JWT issuer (RS256)'},
 {id:'order',   x:720,y:330,icon:'service', c:'#8a2d8f',name:'Order',      role:'Saga · mTLS'},
 {id:'inventory',x:720,y:520,icon:'service',c:'#8a2d8f',name:'Inventory',  role:'mTLS peer'},
 {id:'payment', x:978,y:330,icon:'service', c:'#8a2d8f',name:'Payment',    role:'Envelope encrypt thẻ'},
 {id:'vault',   x:978,y:520,icon:'kms',     c:'#b45309',name:'Vault',      role:'KMS · Transit · AppRole'},
 {id:'cloud',   x:1180,y:330,icon:'cloud',  c:'#9b2226',name:'Tailscale',  role:'WireGuard tunnel'},
 {id:'postgres',x:1367,y:200,icon:'db',     c:'#9b2226',name:'PostgreSQL', role:'TLS + password'},
 {id:'kafka',   x:1367,y:400,icon:'broker', c:'#9b2226',name:'Kafka',      role:'qua WireGuard'},
 {id:'stripe',  x:978,y:140,icon:'cloud',   c:'#64788f',name:'Stripe API', role:'Internet'},
];
const M={};nodes.forEach(n=>M[n.id]=n);
const P=id=>([M[id].x,M[id].y]);

/* =================== EDGES — nhãn = cơ chế bảo mật =================== */
const STYLE={
  tls  :{c:'#0a7d82',mk:'m-tls'},
  oidc :{c:'#1f6fb2',mk:'m-oidc'},
  mtls :{c:'#8a2d8f',mk:'m-mtls'},
  vault:{c:'#b45309',mk:'m-vault'},
  wg   :{c:'#9b2226',mk:'m-wg'},
};
const edges=[
 {pts:['client','nginx'],k:'tls',l:'HTTPS · TLS 1.3',lp:[240,388]},
 {pts:['nginx','envoy'],k:'mtls',l:'mTLS',lp:[440,388]},
 // bảo vệ tài khoản
 {pts:['nginx',[360,610],'keycloak'],k:'oidc',l:'OAuth2 / OIDC login',lp:[388,602]},
 {pts:['envoy',[520,610],'keycloak'],k:'oidc',l:'JWKS · verify JWT (RS256)',lp:[520,500]},
 {pts:['envoy',[600,400],[600,330],'order'],k:'oidc',l:'JWT Bearer',lp:[600,300]},
 // service mesh
 {pts:['order','inventory'],k:'mtls',l:'mTLS',lp:[720,430]},
 {pts:['order','payment'],k:'mtls',l:'mTLS',lp:[849,330]},
 // secrets / crypto
 {pts:['payment','vault'],k:'vault',l:'Vault Transit + AppRole',lp:[978,432]},
 // ra internet
 {pts:['payment','stripe'],k:'tls',l:'TLS + API key',lp:[978,238]},
 // cross-host
 {pts:['payment','cloud'],k:'wg',l:''},
 {pts:['cloud',[1180,200],'postgres'],k:'wg',l:'WireGuard + TLS',lp:[1272,192]},
 {pts:['cloud',[1180,400],'kafka'],k:'wg',l:'WireGuard',lp:[1262,408]},
];

function trim(pts,r){
  const p=pts.map(q=>q.slice());
  const mv=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;return [a[0]+dx/d*r,a[1]+dy/d*r];};
  p[0]=mv(p[0],p[1]); p[p.length-1]=mv(p[p.length-1],p[p.length-2]);
  return p;
}
edges.forEach(ed=>{
  const st=STYLE[ed.k];
  const raw=ed.pts.map(q=>typeof q==='string'?P(q):q);
  const p=trim(raw,27);
  add(el('path',{d:'M '+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L '),
     fill:'none',stroke:st.c,'stroke-width':2.4,'marker-end':`url(#${st.mk})`,'stroke-linejoin':'round',opacity:.95}));
  if(ed.l){const lp=ed.lp,w=ed.l.length*6.0+12;
    add(el('rect',{x:lp[0]-w/2,y:lp[1]-9,width:w,height:16,rx:4,fill:'#fff',stroke:st.c,'stroke-width':.8,opacity:.97}));
    add(el('text',{x:lp[0],y:lp[1]+3,'text-anchor':'middle',class:'e-label',fill:st.c},txt(ed.l)));}
});

/* =================== NODES on top =================== */
nodes.forEach(n=>{
  const g=el('g',{transform:`translate(${n.x},${n.y})`});
  const ic=icon(n.icon,n.c);ic.setAttribute('transform','translate(0,-2)');g.appendChild(ic);
  g.appendChild(el('text',{x:0,y:31,'text-anchor':'middle',class:'n-name'},txt(n.name)));
  g.appendChild(el('text',{x:0,y:44,'text-anchor':'middle',class:'n-role'},txt(n.role)));
  add(g);
});
</script>
</body>
</html>
