<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIT Store — Kênh giao tiếp & Cơ chế bảo mật</title>
<style>
    :root{ --bg:#eef2f6; --ink:#16314a; --muted:#5d6f82; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    header{padding:18px 30px;border-bottom:1px solid #cfd9e2;background:#fff;
        display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
    h1{font-size:21px;font-weight:700}
    header p{font-size:13px;color:var(--muted);margin-top:4px}
    .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;align-items:center}
    .lg{display:flex;align-items:center;gap:8px;font-weight:600}
    .ll{width:30px;border-top-width:4px;border-top-style:solid}
    .ll.tls{border-color:#0a7d82} .ll.oidc{border-color:#1f6fb2}
    .ll.mtls{border-color:#8a2d8f} .ll.vault{border-color:#b45309} .ll.wg{border-color:#9b2226}
    #wrap{padding:20px;overflow:auto}
    svg{display:block;background:#fff;border:1px solid #cfd9e2;border-radius:8px;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    .n-name{font-weight:700;font-size:15px;fill:var(--ink)}
    .n-role{font-size:12.5px;fill:var(--muted)}
    .e-label{font-size:12.5px;font-weight:700}
    .z-machine{font-size:14px;font-weight:700}
</style>
</head>
<body>
<header>
    <div>
        <h1>UIT Store — Kênh giao tiếp & Cơ chế bảo mật</h1>
        <p>NT219 Cryptography — mỗi đường nối ghi rõ hình thức bảo mật dùng để giao tiếp</p>
    </div>
    <div class="legend">
        <div class="lg"><span class="ll tls"></span>TLS / HTTPS</div>
        <div class="lg"><span class="ll oidc"></span>OAuth2 / OIDC / JWT</div>
        <div class="lg"><span class="ll mtls"></span>mTLS</div>
        <div class="lg"><span class="ll vault"></span>Vault Transit / AppRole</div>
        <div class="lg"><span class="ll wg"></span>WireGuard (Tailscale)</div>
    </div>
</header>
<div id="wrap"><svg id="svg" width="1440" height="790" viewBox="0 0 1440 790"></svg></div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a,c){const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!=='')e.setAttribute(k,a[k]);
    if(c)[].concat(c).forEach(x=>e.appendChild(x));return e;}
function add(e){svg.appendChild(e);return e;}
function txt(s){return document.createTextNode(s);}
function poly(pts,fill,stroke){return el('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill,stroke:stroke||'#0e3e63','stroke-width':1.1,'stroke-linejoin':'round'});}

/* Cisco blue palette */
const BL={lite:'#46a6df',mid:'#1f7ec2',dark:'#155a8a',ln:'#0e3e63'};

const defs=el('defs');
[['m-tls','#0a7d82'],['m-oidc','#1f6fb2'],['m-mtls','#8a2d8f'],['m-vault','#b45309'],['m-wg','#9b2226']].forEach(([id,c])=>
    defs.appendChild(el('marker',{id,viewBox:'0 -6 12 12',refX:9,refY:0,markerWidth:8,markerHeight:8,orient:'auto'},
        el('path',{d:'M0,-6 L12,0 L0,6 Z',fill:c}))));
const f=el('filter',{id:'sh',x:'-30%',y:'-30%',width:'160%',height:'160%'});
f.appendChild(el('feDropShadow',{dx:1.5,dy:2.5,stdDeviation:1.6,'flood-color':'#16314a','flood-opacity':0.22}));
defs.appendChild(f);
svg.appendChild(defs);

/* =================== ZONES =================== */
const zones=[
 {label:'MÁY HOST A  —  3 VM (libvirt 192.168.122.x)',x:250,y:268,w:760,h:424,col:'#1f6fb2'},
 {label:'MÁY HOST B  —  Tailscale',x:1252,y:158,w:150,h:344,col:'#9b2226'},
];
zones.forEach(z=>{
    add(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:14,
        fill:z.col==='#9b2226'?'rgba(155,34,38,.03)':'rgba(31,111,178,.025)',
        stroke:z.col,'stroke-width':2.2,'stroke-dasharray':'9 6'}));
    add(el('rect',{x:z.x+12,y:z.y-13,width:z.label.length*7.6+16,height:26,rx:6,fill:'#fff',stroke:z.col,'stroke-width':1.2}));
    add(el('text',{x:z.x+22,y:z.y+5,class:'z-machine',fill:z.col},txt(z.label)));
});
add(el('line',{x1:1132,y1:185,x2:1132,y2:472,stroke:'#9b2226','stroke-width':1.4,'stroke-dasharray':'8 6'}));

/* =================== CISCO-STYLE ICONS =================== */
function icon(type){const g=el('g',{filter:'url(#sh)'}),A=e=>g.appendChild(e);
  switch(type){
    case 'laptop':{
      A(poly([[-22,-16],[22,-16],[18,10],[-18,10]],'#e8f3fb'));        // screen frame
      A(poly([[-18,-12],[18,-12],[15,6],[-15,6]],BL.mid));             // screen
      A(poly([[-28,10],[28,10],[24,18],[-24,18]],BL.lite));           // base
      A(el('rect',{x:-6,y:11,width:12,height:3,rx:1.5,fill:BL.dark}));
      break;}
    case 'switch':{ // 3D slab with arrows
      const FTL=[-28,-4],FTR=[18,-4],FBL=[-28,11],FBR=[18,11],
            BTL=[-16,-16],BTR=[30,-16],BBR=[30,-1];
      A(poly([FTL,FTR,FBR,FBL],BL.mid));      // front
      A(poly([FTR,BTR,BBR,FBR],BL.dark));     // right
      A(poly([FTL,FTR,BTR,BTL],BL.lite));     // top
      // white double arrows on top
      const cx=3,cy=-10;
      [[ -13,0, 13,0],[ -7,7, 7,-7]].forEach(([x1,y1,x2,y2])=>{
        A(el('line',{x1:cx+x1,y1:cy+y1,x2:cx+x2,y2:cy+y2,stroke:'#fff','stroke-width':1.8,'stroke-linecap':'round'}));
        // arrowheads both ends
        A(el('path',{d:`M${cx+x1},${cy+y1} l4,-2 m-4,2 l4,2`,stroke:'#fff','stroke-width':1.6,fill:'none','stroke-linecap':'round'}));
        A(el('path',{d:`M${cx+x2},${cy+y2} l-4,-2 m4,2 l-4,2`,stroke:'#fff','stroke-width':1.6,fill:'none','stroke-linecap':'round'}));
      });
      break;}
    case 'server':{ // 3D tower
      const FTL=[-16,-22],FTR=[16,-22],FBL=[-16,22],FBR=[16,22],
            BTL=[-8,-30],BTR=[24,-30],BBR=[24,14];
      A(poly([FTL,FTR,FBR,FBL],BL.mid));    // front
      A(poly([FTR,BTR,BBR,FBR],BL.dark));   // right
      A(poly([FTL,FTR,BTR,BTL],BL.lite));   // top
      for(let i=0;i<3;i++)A(el('line',{x1:-11,y1:-12+i*11,x2:11,y2:-12+i*11,stroke:'#dff0fb','stroke-width':2,'stroke-linecap':'round'}));
      A(el('circle',{cx:-7,cy:-17,r:2,fill:'#bfe3f7'}));A(el('circle',{cx:0,cy:-17,r:2,fill:'#bfe3f7'}));
      break;}
    case 'db':{ // 3D cylinder
      A(el('path',{d:'M-17,-16 a17,6 0 0 1 34,0 V16 a17,6 0 0 1 -34,0 Z',fill:BL.mid,stroke:BL.ln,'stroke-width':1.1}));
      A(el('path',{d:'M-17,-16 a17,6 0 0 0 34,0',fill:BL.lite,stroke:BL.ln,'stroke-width':1.1}));
      A(el('path',{d:'M-17,-3 a17,6 0 0 0 34,0 M-17,8 a17,6 0 0 0 34,0',fill:'none',stroke:'#bfe3f7','stroke-width':1.4}));
      break;}
    case 'cloud':{
      A(el('path',{d:'M-24,11 a13,13 0 0 1 2,-26 a16,16 0 0 1 30,4 a12,12 0 0 1 3,22 Z',
        fill:'#eaf4fb',stroke:BL.mid,'stroke-width':2.2,'stroke-linejoin':'round'}));
      break;}
  }return g;}

/* =================== NODES =================== */
const nodes=[
 {id:'client',  x:110,y:400,icon:'laptop',name:'Client',     role:'Browser'},
 {id:'nginx',   x:300,y:400,icon:'server',name:'Nginx',      role:'TLS termination'},
 {id:'envoy',   x:500,y:400,icon:'switch',name:'Envoy',      role:'Kiểm tra JWT + mTLS'},
 {id:'keycloak',x:470,y:618,icon:'server',name:'Keycloak',   role:'JWT issuer (OIDC, RS256)'},
 {id:'order',   x:712,y:342,icon:'server',name:'Order',      role:'Saga orchestrator'},
 {id:'inventory',x:712,y:548,icon:'server',name:'Inventory', role:'mTLS peer'},
 {id:'payment', x:942,y:342,icon:'server',name:'Payment',    role:'Mã hóa thẻ (envelope)'},
 {id:'vault',   x:942,y:548,icon:'server',name:'Vault',      role:'KMS (Transit, AppRole)'},
 {id:'cloud',   x:1132,y:342,icon:'cloud', name:'Tailscale', role:'WireGuard tunnel'},
 {id:'postgres',x:1327,y:236,icon:'db',    name:'PostgreSQL',role:'TLS + password'},
 {id:'kafka',   x:1327,y:448,icon:'server',name:'Kafka',     role:'qua WireGuard'},
 {id:'stripe',  x:942,y:152,icon:'cloud', name:'Stripe API',role:'Internet'},
];
const M={};nodes.forEach(n=>M[n.id]=n);

/* =================== EDGES (straight, Cisco style) =================== */
const STYLE={tls:{c:'#0a7d82',mk:'m-tls'},oidc:{c:'#1f6fb2',mk:'m-oidc'},
  mtls:{c:'#8a2d8f',mk:'m-mtls'},vault:{c:'#b45309',mk:'m-vault'},wg:{c:'#9b2226',mk:'m-wg'}};
const edges=[
 {s:'client',t:'nginx',k:'tls',l:'HTTPS / TLS 1.3'},
 {s:'nginx',t:'envoy',k:'mtls',l:'mTLS'},
 {s:'nginx',t:'keycloak',k:'oidc',l:'OAuth2 / OIDC'},
 {s:'envoy',t:'keycloak',k:'oidc',l:'JWKS (kiểm tra JWT)'},
 {s:'envoy',t:'order',k:'oidc',l:'JWT Bearer'},
 {s:'order',t:'inventory',k:'mtls',l:'mTLS'},
 {s:'order',t:'payment',k:'mtls',l:'mTLS'},
 {s:'payment',t:'vault',k:'vault',l:'Vault Transit + AppRole'},
 {s:'payment',t:'stripe',k:'tls',l:'TLS + API key'},
 {s:'payment',t:'cloud',k:'wg',l:''},
 {s:'cloud',t:'postgres',k:'wg',l:'WireGuard + TLS'},
 {s:'cloud',t:'kafka',k:'wg',l:'WireGuard'},
];
function trimPts(s,e,r1,r2){const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy)||1;
  return [{x:s.x+dx/d*r1,y:s.y+dy/d*r1},{x:e.x-dx/d*r2,y:e.y-dy/d*r2}];}

// draw lines first
const labelJobs=[];
edges.forEach(ed=>{
  const st=STYLE[ed.k],s=M[ed.s],e=M[ed.t];
  const [a,b]=trimPts(s,e,32,30);
  add(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:st.c,'stroke-width':2.6,'marker-end':`url(#${st.mk})`}));
  if(ed.l){ // label offset perpendicular so it never sits on the line/arrow
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    let nx=-dy/d,ny=dx/d; if(ny>0){nx=-nx;ny=-ny;}      // point upward
    labelJobs.push({x:mx+nx*17,y:my+ny*17,l:ed.l,c:st.c});
  }
});
// labels on top
labelJobs.forEach(j=>{const w=j.l.length*7.0+14;
  add(el('rect',{x:j.x-w/2,y:j.y-11,width:w,height:21,rx:5,fill:'#fff',stroke:j.c,'stroke-width':1}));
  add(el('text',{x:j.x,y:j.y+4,'text-anchor':'middle',class:'e-label',fill:j.c},txt(j.l)));
});

/* =================== NODE ICONS + LABELS on top =================== */
nodes.forEach(n=>{
  const g=el('g',{transform:`translate(${n.x},${n.y})`});
  g.appendChild(icon(n.icon));
  g.appendChild(el('text',{x:0,y:42,'text-anchor':'middle',class:'n-name'},txt(n.name)));
  g.appendChild(el('text',{x:0,y:58,'text-anchor':'middle',class:'n-role'},txt(n.role)));
  add(g);
});
</script>
</body>
</html>
