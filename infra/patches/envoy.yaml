cat >/etc/envoy/envoy.yaml <<ENVOYCFG
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: service_mesh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/auth/" }
                          route: { cluster: keycloak_service }
                        - match: { prefix: "/api/v1/catalog" }
                          route: { cluster: catalog_service, prefix_rewrite: "/api/v1" }
                        - match: { prefix: "/api/v1/cart" }
                          route: { cluster: cart_service, prefix_rewrite: "/api/v1" }
                        - match: { prefix: "/api/v1/orders" }
                          route: { cluster: order_service, prefix_rewrite: "/api/v1" }
                        - match: { prefix: "/api/v1/inventory" }
                          route: { cluster: inventory_service, prefix_rewrite: "/api/v1" }
                        - match: { prefix: "/api/v1/shipping" }
                          route: { cluster: shipping_service, prefix_rewrite: "/api/v1" }
                        - match: { prefix: "/api/v1/notifications" }
                          route: { cluster: notification_service, prefix_rewrite: "/api/v1" }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: api_rate_limit
                      token_bucket:
                        max_tokens: 100
                        tokens_per_fill: 100
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-rate-limit-limit
                            value: "100"
                      status:
                        code: 429
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /etc/envoy/waf.lua
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: keycloak_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: keycloak_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8080

    # Tất cả đều trỏ vào NODE-2 (Service Mesh)
    - name: catalog_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: catalog_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${VM2_IP}
                      port_value: 8001

    - name: cart_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: cart_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${VM2_IP}
                      port_value: 8002

    - name: order_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: order_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${VM2_IP}
                      port_value: 8003

    - name: inventory_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: inventory_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${VM2_IP}
                      port_value: 8005

    - name: shipping_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: shipping_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${VM2_IP}
                      port_value: 8007

    - name: notification_service
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: notification_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${VM2_IP}
                      port_value: 8008
